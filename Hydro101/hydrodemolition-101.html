<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    <title>Hydrodemolition 101</title>
    <!--
  app-id:    hydrodemolition-101
  version:   0.3.0
  owner:     lyondsgn
  purpose:   Animated, tappable 3D cutaway that teaches new PMs how a hydrodemolition job is set up and run.
  uses:      pdf (print / save as PDF handout)
  externals: Google Fonts (system-font fallback)
  qb-tables: none
-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    <style>
         :root {
            --bg: #eef0f2;
            --surface: #fbfcfc;
            --ink: #1b2227;
            --muted: #5a6670;
            --line: #d5dbdf;
            --grid: #e3e7ea;
            --accent: #1d5c96;
            --warn: #a8690f;
            --bad: #b42318;
            --edge: #2a3238;
            --conc: #bdb7aa;
            --floor: #d3cdc1;
            --yard: #e0dbd0;
            --soil: #c9bca4;
            --steel: #5b666f;
            --cont: #56626c;
            --tank: #8b969f;
            --hose: #3f474e;
            --equip: #e2ad2c;
            --wood: #b9874f;
            --seal: #5d7f9a;
            --robot: #d4d8db;
            --robot-pnl: #e8e3d2;
            --water: #2a7fc1;
            --uhp: #7048c0;
            --air: #8d99a3;
            --sludge: #8a6a3d;
            --treated: #1f9e8f;
            --co2: #b8c1c8;
            --paint-g: #2e9e4f;
            --paint-r: #c8372d;
            --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
            --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            color-scheme: light;
        }
        
        @media (prefers-color-scheme: dark) {
             :root:not([data-theme="light"]) {
                --bg: #13171a;
                --surface: #1b2125;
                --ink: #e3e8eb;
                --muted: #95a1aa;
                --line: #2e373d;
                --grid: #262e33;
                --accent: #6aa9e6;
                --warn: #e0a43a;
                --bad: #f07360;
                --edge: #0b0e10;
                --conc: #77726a;
                --floor: #55514a;
                --yard: #2c2a26;
                --soil: #211e1a;
                --steel: #8e9aa3;
                --cont: #46525c;
                --tank: #67737c;
                --hose: #2a3035;
                --equip: #d39f2a;
                --wood: #a87a46;
                --seal: #7fa3c0;
                --robot: #aeb4b9;
                --robot-pnl: #c4bfae;
                --water: #5aa8e6;
                --uhp: #a585ec;
                --air: #a4b0b9;
                --sludge: #b08a55;
                --treated: #4fc4b4;
                --co2: #9aa5ae;
                --paint-g: #4cc070;
                --paint-r: #f07360;
                color-scheme: dark
            }
        }
        
         :root[data-theme="dark"] {
            --bg: #13171a;
            --surface: #1b2125;
            --ink: #e3e8eb;
            --muted: #95a1aa;
            --line: #2e373d;
            --grid: #262e33;
            --accent: #6aa9e6;
            --warn: #e0a43a;
            --bad: #f07360;
            --edge: #0b0e10;
            --conc: #77726a;
            --floor: #55514a;
            --yard: #2c2a26;
            --soil: #211e1a;
            --steel: #8e9aa3;
            --cont: #46525c;
            --tank: #67737c;
            --hose: #2a3035;
            --equip: #d39f2a;
            --wood: #a87a46;
            --seal: #7fa3c0;
            --robot: #aeb4b9;
            --robot-pnl: #c4bfae;
            --water: #5aa8e6;
            --uhp: #a585ec;
            --air: #a4b0b9;
            --sludge: #b08a55;
            --treated: #4fc4b4;
            --co2: #9aa5ae;
            --paint-g: #4cc070;
            --paint-r: #f07360;
            color-scheme: dark
        }
        
        * {
            box-sizing: border-box
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 var(--f-body);
            padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(48px + env(safe-area-inset-bottom, 0px))
        }
        
        .wrap {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px
        }
        
        a {
            color: var(--accent)
        }
        
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px
        }
        
        .back {
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            min-height: 44px
        }
        
        .env {
            font: 600 11px var(--f-body);
            letter-spacing: .07em;
            text-transform: uppercase;
            border: 1px solid currentColor;
            border-radius: 999px;
            padding: 2px 9px;
            color: var(--warn)
        }
        
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 10px 20px
        }
        
        h1 {
            font: 600 2.1rem/1 var(--f-display);
            letter-spacing: .01em;
            margin: 0
        }
        
        h2 {
            font: 600 1.4rem/1.15 var(--f-display);
            letter-spacing: .02em;
            margin: 0
        }
        
        h3 {
            font: 600 1.1rem/1.2 var(--f-display);
            letter-spacing: .02em;
            margin: 0
        }
        
        .btn {
            font: 500 14px var(--f-body);
            color: var(--accent);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 9px 14px;
            min-height: 44px;
            cursor: pointer
        }
        
        .btn:hover {
            border-color: var(--accent)
        }
        
        .btn:disabled {
            opacity: .4;
            cursor: default
        }
        
        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--surface)
        }
        
         :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }
        
        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px;
            min-width: 0
        }
        /* step bar */
        
        .steps {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 2px 6px;
            margin: 0 0 10px;
            list-style: none;
            scrollbar-width: thin
        }
        
        .steps button {
            flex: 0 0 auto;
            font: 500 13px var(--f-body);
            color: var(--muted);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 8px 13px;
            min-height: 40px;
            cursor: pointer;
            white-space: nowrap
        }
        
        .steps button b {
            font-family: var(--f-mono);
            font-weight: 600;
            margin-right: 5px
        }
        
        .steps button[aria-current="step"] {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--surface)
        }
        /* stage */
        
        .stage {
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            border-radius: 6px;
            background: var(--surface);
            -webkit-overflow-scrolling: touch
        }
        
        #scene {
            display: block;
            width: 100%;
            height: auto
        }
        
        .pan {
            display: none;
            font-size: 12px;
            color: var(--muted);
            margin: 6px 0 0
        }
        
        #scene text {
            font-family: var(--f-body)
        }
        
        .face {
            stroke: var(--edge);
            stroke-width: 1;
            stroke-linejoin: round
        }
        
        .lit {
            fill: #fff;
            opacity: .2;
            pointer-events: none
        }
        
        .shd {
            fill: #000;
            opacity: .2;
            pointer-events: none
        }
        
        .lbl {
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: .05em;
            fill: var(--ink);
            paint-order: stroke;
            stroke: var(--surface);
            stroke-width: 4px;
            stroke-linejoin: round
        }
        
        .floorlbl {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .1em;
            fill: var(--muted)
        }
        
        .mini {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .06em
        }
        
        .badge circle {
            fill: var(--ink);
            transition: fill .2s
        }
        
        .badge text {
            fill: var(--surface);
            font: 600 12px var(--f-mono)!important
        }
        
        .part {
            cursor: pointer;
            transition: opacity .35s
        }
        
        .part:hover .badge circle,
        .part:focus-visible .badge circle {
            fill: var(--accent)
        }
        
        .part:focus {
            outline: none
        }
        
        .hit {
            fill: transparent;
            cursor: pointer
        }
        
        .hit.kb {
            stroke: var(--accent);
            stroke-width: 2;
            stroke-dasharray: 4 3
        }
        
        .dim {
            opacity: .18
        }
        
        .hose {
            fill: none;
            stroke: var(--hose);
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: opacity .35s
        }
        
        .shine {
            fill: none;
            stroke: #fff;
            opacity: .28;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            transition: opacity .35s
        }
        
        .dimh {
            opacity: .22
        }
        
        .shine.dimh {
            opacity: .06
        }
        
        .flow {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 6 12;
            opacity: 0;
            transition: opacity .35s
        }
        
        .flow.on {
            opacity: 1;
            animation: flow 1s linear infinite
        }
        
        .flow.k-uhp.on {
            animation-duration: .45s
        }
        
        .k-water {
            stroke: var(--water)
        }
        
        .k-uhp {
            stroke: var(--uhp)
        }
        
        .k-air {
            stroke: var(--air);
            stroke-dasharray: 3 7
        }
        
        .k-sludge {
            stroke: var(--sludge)
        }
        
        .k-treated {
            stroke: var(--treated)
        }
        
        .k-co2 {
            stroke: var(--co2);
            stroke-dasharray: 2 6
        }
        
        @keyframes flow {
            to {
                stroke-dashoffset: -18
            }
        }
        
        #spray {
            opacity: 0;
            transition: opacity .3s
        }
        
        #spray.on {
            opacity: 1
        }
        
        #spray path {
            fill: none;
            stroke: var(--water);
            stroke-width: 2.6;
            stroke-dasharray: 4 4;
            stroke-linecap: round
        }
        
        #spray.on path {
            animation: flow .4s linear infinite
        }
        
        #chip.on {
            animation: buzz .09s linear infinite
        }
        
        @keyframes buzz {
            50% {
                transform: translate(.8px, -.8px)
            }
        }
        
        #skid.on {
            animation: scoop 4s ease-in-out infinite
        }
        
        @keyframes scoop {
            50% {
                transform: translateX(10px)
            }
        }
        
        .bub {
            fill: none;
            stroke: #fff;
            stroke-width: 1.4;
            opacity: 0
        }
        
        #bubbles.on .bub {
            animation: rise 1.8s ease-in infinite
        }
        
        @keyframes rise {
            0% {
                opacity: 0;
                transform: translateY(0)
            }
            20% {
                opacity: .9
            }
            100% {
                opacity: 0;
                transform: translateY(-40px)
            }
        }
        
        #mneedle.on {
            animation: spin 1.6s linear infinite;
            transform-origin: 1250px 541px
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
        
        #jet circle {
            fill: var(--water);
            animation: flick .25s linear infinite alternate
        }
        
        @keyframes flick {
            to {
                opacity: .3
            }
        }
        
        .tw {
            transition: opacity .6s
        }
        
        #excl {
            transition: opacity .35s
        }
        
        @media (prefers-reduced-motion:reduce) {
            .flow.on,
            #spray.on path,
            #chip.on,
            #skid.on,
            #bubbles.on .bub,
            #mneedle.on,
            #jet circle {
                animation: none
            }
            #bubbles.on .bub {
                opacity: .9
            }
        }
        /* legend */
        
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 12.5px;
            color: var(--muted);
            margin-top: 10px
        }
        
        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px
        }
        
        .legend i {
            display: inline-block;
            width: 22px;
            border-top: 3px solid
        }
        /* step card */
        
        .card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px 24px;
            align-items: start;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--grid)
        }
        
        .card .kicker {
            font: 600 12px var(--f-body);
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--muted)
        }
        
        .card p {
            margin: 6px 0 0;
            max-width: 75ch
        }
        
        .safety {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding: 10px 12px;
            border: 1px solid var(--warn);
            border-left-width: 4px;
            border-radius: 6px;
            font-size: 14px;
            max-width: 75ch
        }
        
        .safety::before {
            content: "⚠";
            color: var(--warn);
            font-size: 16px;
            line-height: 1.3
        }
        
        .safety[hidden] {
            display: none
        }
        
        .nav {
            display: flex;
            gap: 8px
        }
        /* parts grid */
        
        .parts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 8px;
            margin: 12px 0 0;
            padding: 0;
            list-style: none
        }
        
        .parts button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            font: 500 14px var(--f-body);
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 12px;
            min-height: 48px;
            cursor: pointer
        }
        
        .parts button:hover {
            border-color: var(--accent)
        }
        
        .num {
            flex: 0 0 auto;
            display: inline-grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--ink);
            color: var(--surface);
            font: 600 12.5px var(--f-mono)
        }
        /* collapsible sections */
        
        .fold summary {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            cursor: pointer;
            list-style: none
        }
        
        .fold summary::-webkit-details-marker {
            display: none
        }
        
        .fold summary::before {
            content: "▸";
            color: var(--muted);
            transition: transform .15s
        }
        
        .fold[open] summary::before {
            transform: rotate(90deg)
        }
        /* glossary */
        
        .gloss {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px 28px;
            margin: 12px 0 0
        }
        
        .gloss div {
            break-inside: avoid
        }
        
        .gloss dt {
            font-weight: 600
        }
        
        .gloss dd {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: 14px
        }
        /* dialog */
        
        dialog {
            width: min(560px, calc(100vw - 32px));
            max-height: calc(100dvh - 48px);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 0;
            background: var(--surface);
            color: var(--ink);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .25)
        }
        
        dialog::backdrop {
            background: rgba(10, 14, 17, .5)
        }
        
        .dlg {
            padding: 18px 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }
        
        .dlg-h {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px
        }
        
        .dlg-h h2 {
            display: flex;
            align-items: center;
            gap: 10px
        }
        
        .dlg h4 {
            margin: 4px 0 0;
            font: 600 12px var(--f-body);
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--muted)
        }
        
        .dlg p {
            margin: 2px 0 0
        }
        
        .dlg ul {
            margin: 2px 0 0;
            padding-left: 20px
        }
        
        .close {
            min-width: 44px;
            min-height: 44px;
            font-size: 20px;
            line-height: 1;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: transparent;
            color: var(--ink);
            cursor: pointer
        }
        
        .seen {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 2px
        }
        
        .seen button {
            font: 500 13px var(--f-body);
            color: var(--accent);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 11px;
            min-height: 36px;
            cursor: pointer
        }
        
        #handout {
            display: none
        }
        
        @media (max-width:860px) {
            #scene {
                min-width: 920px
            }
            .pan {
                display: block
            }
            h1 {
                font-size: 1.8rem
            }
            .card {
                grid-template-columns: minmax(0, 1fr)
            }
            .nav .btn {
                flex: 1
            }
        }
        /* print: one page. Diagram + legend, short steps in two columns, equipment key in three. */
        
        @media print {
            @page {
                margin: 10mm
            }
            body {
                background: #fff;
                color: #000;
                padding: 0;
                font-size: 9pt;
                line-height: 1.35
            }
            .wrap {
                max-width: none;
                gap: 6px
            }
            .no-print,
            .steps,
            .card,
            .pan,
            .top,
            .glossary {
                display: none!important
            }
            h1 {
                font-size: 20pt
            }
            .panel {
                border: 0;
                padding: 0;
                break-inside: avoid
            }
            .stage {
                overflow: visible
            }
            #scene {
                min-width: 0!important
            }
            .legend {
                font-size: 7.5pt;
                gap: 2px 12px;
                margin-top: 4px
            }
            .flow,
            .flow.on,
            #spray path,
            #chip,
            #skid,
            .bub,
            #mneedle {
                animation: none!important
            }
            .dim {
                opacity: 1!important
            }
            #handout {
                display: block;
                break-inside: avoid
            }
            #handout h2 {
                font-size: 12pt;
                margin: 8px 0 4px
            }
            .h-steps {
                columns: 2;
                column-gap: 8mm;
                margin: 0;
                padding-left: 16px
            }
            .h-steps li {
                break-inside: avoid;
                margin-bottom: 4px
            }
            .h-key {
                columns: 3;
                column-gap: 6mm;
                margin: 0;
                padding: 0;
                list-style: none
            }
            .h-key li {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 3px;
                break-inside: avoid
            }
            .h-key .num {
                width: 18px;
                height: 18px;
                font-size: 8pt;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="top">
            <a class="back" id="back" href="../index.html">← All tools</a>
            <span class="env" id="env" hidden>Prototype</span>
        </div>

        <header>
            <div>
                <h1>Hydrodemolition 101</h1>
            </div>
            <button class="btn no-print" id="print" type="button">Print / save handout</button>
        </header>

        <section class="panel" aria-label="Process diagram">
            <nav aria-label="Process steps">
                <ul class="steps" id="steps"></ul>
            </nav>
            <div class="stage" id="stage">
                <svg id="scene" viewBox="0 170 1300 450" role="img" aria-labelledby="scene-title">
        <title id="scene-title">3D cutaway of a hydrodemolition job: water supply, UHP pumps and compressor on the left; the robot cutting the upper slab; shoring and containment on the floor below; settling and treatment tanks and the discharge to sewer on the right.</title>
        <defs>
          <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/>
          </linearGradient>
          <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#000" stop-opacity=".15"/><stop offset=".35" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".25"/>
          </linearGradient>

                }, {

// =====================================================================
// Scene: an oblique 3D cutaway. Every point is (x, v, y): x along the

// front plane. D is how far one full building depth shifts on screen.
// =====================================================================
const NS='http://www.w3.org/2000/svg', DX=52, DY=-40;
const at=(x,v,y)=>[x+DX*v, y+DY*v];
const dep=f=>[DX*f, DY*f];             // on-screen depth of an object that is f of the building deep
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const path=a=>'M'+a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e;}
function face(par,p,fill,tone){ el('polygon',{points:pts(p),fill,class:'face'},par); if(tone) el('polygon',{points:pts(p),class:tone},par); }
// box with front-bottom-left at (x,y); d = [dx,dy] on-screen depth of this object
function box(par,x,y,w,h,fill,d=dep(.45),gloss=true){
  const [dx,dy]=d, g=el('g',{},par);
  face(g,[[x,y-h],[x+w,y-h],[x+w+dx,y-h+dy],[x+dx,y-h+dy]],fill,'lit');
  face(g,[[x+w,y],[x+w,y-h],[x+w+dx,y-h+dy],[x+w+dx,y+dy]],fill,'shd');
  el('rect',{x,y:y-h,width:w,height:h,fill,class:'face'},g);
  if(gloss) el('rect',{x,y:y-h,width:w,height:h,fill:'url(#gloss)','pointer-events':'none'},g);
  return g;
}
const R=$('root'), L={};
['ground','backhose','cback','cfloor','lower','lowhose','yard','yhose','cols','slab','hole','paint','tophose','upper','excl','debris','labels','hits'].forEach(k=>L[k]=el('g',{id:'L-'+k},R));
const partG={};
function part(k,layer){ const g=el('g',{class:'part','data-part':k},L[layer]); (partG[k]=partG[k]||[]).push(g); return g; }
function label(k,x,y,text,anchor='start'){
  const g=part(k,'labels'), n=PARTS[k].n, tx=anchor==='end'?x-18:x+18;

  el('text',{class:'lbl',x:tx,y:y+4.5,'text-anchor':anchor},g).textContent=text;
}
// a crew member with feet at (x,y), drawn in local coords around the feet so tools can be added the same way
function worker(par,x,y,s=1.3){
  const g=el('g',{transform:`translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s})`},par);
  el('path',{d:'M0,-24 L0,-12 M0,-12 L-6,0 M0,-12 L6,0',fill:'none',stroke:'var(--ink)','stroke-width':3,'stroke-linecap':'round'},g);
  el('circle',{cx:0,cy:-31,r:6,fill:'var(--ink)'},g);
  el('path',{d:'M-8,-33 a8,7 0 0 1 16,0z',fill:'var(--equip)',stroke:'var(--edge)','stroke-width':.8},g);
  return g;
}

function drawSlab(fx){
  if(lastFx!==null && Math.abs(fx-lastFx)<.3) return; lastFx=fx;
  const open=fx<DEMO[1]-.5, E=DEMO[1];
  const top=[at(fx,0,300),at(E,0,300),at(E,HV,300),at(fx,HV,300)];
  let d=path([at(385,0,300),at(895,0,300),at(895,1,300),at(385,1,300)])+'Z';
  if(open) d+=' '+path(top)+'Z';
  slabTop.setAttribute('d',d); slabTopLit.setAttribute('d',d);
  slabFront.setAttribute('d',open?`M385,300 H${fx} V${CUT} H${E} V300 H895 V330 H385Z`:'M385,300 H895 V330 H385Z');
  clipTop.setAttribute('points',open?pts(top):'');
  clipFront.setAttribute('points',open?pts([[fx,300],[E,300],[E,CUT],[fx,CUT]]):'');
  const fl=[at(fx,0,CUT),at(E,0,CUT),at(E,HV,CUT),at(fx,HV,CUT)];
  const bk=[at(fx,HV,300),at(E,HV,300),at(E,HV,CUT),at(fx,HV,CUT)], sd=[at(fx,0,300),at(fx,HV,300),at(fx,HV,CUT),at(fx,0,CUT)];
  for(const [a,b,p] of [[holeFloor,holeFloorS,fl],[holeBack,holeBackS,bk],[holeSide,holeSideS,sd]]){ a.setAttribute('points',open?pts(p):''); b.setAttribute('points',open?pts(p):''); }
  let r='';
  if(open){
    const ln=(a,b)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;
    // top mat only: bars along the building just under the bars running into the page
    for(const v of [.22,.48]) r+=ln(at(fx,v,312),at(E,v,312));
    for(let x=393;x<E;x+=16) if(x>fx) r+=ln(at(x,0,309),at(x,HV,309));
  }
  rebarHole.innerHTML=r;
}

  [-79,-72,-65].forEach(cx=>el('circle',{cx,cy:269,r:2.1,fill:'var(--edge)'},robot));
  // rear swivel post with the unit number plate
  el('rect',{x:-128,y:232,width:7,height:52,fill:RB,class:'face'},robot);
  el('rect',{x:-129,y:271,width:10,height:11,rx:2,fill:RB,class:'face'},robot);
  el('text',{x:-124,y:280,'text-anchor':'middle',style:'font:700 8px var(--f-mono);fill:var(--accent)'},robot).textContent='5';
  // feed beam out front, braced to the chassis
  el('path',{d:'M-38,278 L-24,262',stroke:RB,'stroke-width':4,'stroke-linecap':'round'},robot);
  el('rect',{x:-40,y:256,width:46,height:6,fill:RB,class:'face'},robot);
  // hoses and a yellow cable arching from the rear post to the beam
  el('path',{d:'M-124,234 C-104,208 -50,212 -30,256',fill:'none',stroke:blk,'stroke-width':4,'stroke-linecap':'round'},robot);
  el('path',{d:'M-120,238 C-100,220 -56,222 -36,256',fill:'none',stroke:'#e2ad2c','stroke-width':1.3},robot);
  // rubber tires: big at the rear, smaller at the front
  [[-98,14],[-48,11]].forEach(([cx,r])=>{
    el('circle',{cx,cy:300-r,r,fill:blk,class:'face'},robot);
    el('circle',{cx,cy:300-r,r:r*.45,fill:'var(--steel)'},robot);
  });
}
const lance=el('g',{},robot);
box(lance,-7,266,14,10,'var(--robot)',dep(.15),false);
el('line',{x1:0,y1:266,x2:0,y2:294,stroke:'var(--edge)','stroke-width':4},lance);
el('rect',{x:5,y:276,width:3,height:22,fill:'var(--robot)',class:'face'},lance);
const jet=el('g',{id:'jet',style:'display:none'},lance);
el('line',{x1:0,y1:294,x2:0,y2:301,stroke:'var(--water)','stroke-width':3},jet);
[[-6,297],[6,295],[-3,291],[4,300]].forEach(([cx,cy])=>el('circle',{cx,cy,r:1.8},jet));
label('robot',452,214,'ROBOT');

// ---- 10 chipping: standing behind the opening, breaking out its back edge ----
{ const w=worker(part('chipping','upper'),CHIP[0],CHIP[1]);
  el('path',{d:'M0,-20 L-9,-15',fill:'none',stroke:'var(--ink)','stroke-width':3,'stroke-linecap':'round'},w);
  const c=el('g',{id:'chip'},w);
  el('line',{x1:-9,y1:-19,x2:-12,y2:6,stroke:'var(--steel)','stroke-width':4,'stroke-linecap':'round'},c);
  el('line',{x1:-14,y1:-19,x2:-4,y2:-19,stroke:'var(--steel)','stroke-width':3,'stroke-linecap':'round'},c);
}
label('chipping',780,190,'CHIPPING','end');

// ---- 9 washdown: front-right corner of the opening, wand aimed down into it ----
{ const w=worker(part('washdown','upper'),WASH[0],WASH[1]);
  el('path',{d:'M0,-20 L-11,-16',fill:'none',stroke:'var(--ink)','stroke-width':3,'stroke-linecap':'round'},w);
  el('line',{x1:-9,y1:-17,x2:-28,y2:-9,stroke:'var(--steel)','stroke-width':3.5,'stroke-linecap':'round'},w);
  const s=el('g',{id:'spray','pointer-events':'none'},w);
  ['M-28,-9 L-44,14','M-28,-9 L-36,20','M-28,-9 L-50,6'].forEach(d=>el('path',{d},s));
}
label('washdown',812,246,'WASHDOWN');

// ---- debris particles, reused ----
const DEB=[]; for(let i=0;i<26;i++){ const r=el('rect',{width:4,height:4,x:-10,y:-10,rx:1,fill:'var(--conc)',stroke:'var(--edge)','stroke-width':.5},L.debris); DEB.push({el:r,on:false,x:0,y:0,vy:0}); }
// partial depth: chips kick up out of the cut and land back on the cut floor, somewhere across its depth
function spawn(x){ const p=DEB.find(d=>!d.on); if(!p) return; const v=Math.random()*HV*.9;
  p.on=true; p.x=x+DX*v; p.floor=CUT-3+DY*v; p.y=p.floor-2; p.vy=-(50+Math.random()*90); }

// ---- tap targets: one padded box per part, under the parts so visible shapes win ----
L.hits.remove(); R.insertBefore(L.hits,L.ground.nextSibling);
for(const k in partG){
  let r=null;
  if(k!=='robot'){ // the robot moves, so its own shapes and label take the taps
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const g of partG[k]){ const b=g.getBBox(); x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+b.width); y1=Math.max(y1,b.y+b.height); }
    const pad=6; r=el('rect',{class:'hit',x:x0-pad,y:y0-pad,width:x1-x0+pad*2,height:y1-y0+pad*2,rx:6},L.hits);
    r.addEventListener('click',()=>openPart(k));
  }
  const p=PARTS[k];
  partG[k].forEach((g,i)=>{
    g.addEventListener('click',()=>openPart(k));
    if(i>0) return;
    g.setAttribute('tabindex','0'); g.setAttribute('role','button'); g.setAttribute('aria-label',p.n+'. '+p.name);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); openPart(k);}});
    if(r){ g.addEventListener('focus',()=>r.classList.add('kb')); g.addEventListener('blur',()=>r.classList.remove('kb')); }
  });
}


// ---- part pop-up ----
const dlg=$('dlg');
function openPart(k){
  const p=PARTS[k];
  $('d-title').innerHTML=`<span class="num">${p.n}</span>${esc(p.name)}`;
  const seen=STEPS.map((s,i)=>({s,i})).filter(o=>o.i>0&&o.s.focus.includes(k));
  $('d-body').innerHTML=
    `<h4>What it does</h4><p>${esc(p.what)}</p><h4>Why it matters</h4><p>${esc(p.why)}</p>`+
    `<h4>Connects to</h4><ul>${p.links.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`+
    (p.safety?`<div class="safety">${esc(p.safety)}</div>`:'')+
    (seen.length?`<h4>Shown in</h4><div class="seen">${seen.map(o=>`<button type="button" data-i="${o.i}">Step ${o.i} · ${esc(o.s.chip)}</button>`).join('')}</div>`:'');
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
}
function closeDlg(){ if(dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
$('d-close').addEventListener('click',closeDlg);
dlg.addEventListener('click',e=>{
  if(e.target===dlg) closeDlg(); // backdrop
  const b=e.target.closest('.seen button'); if(b){ closeDlg(); setStep(+b.dataset.i); }
});

// ---- steps ----
let stepIdx=0, cutP=0, hold=0, last=null, clock=0;
const S=()=>STEPS[stepIdx];
function setStep(i,instant){
  stepIdx=Math.max(0,Math.min(STEPS.length-1,i));
  const s=S(), all=s.focus==='all';
  for(const k in partG) partG[k].forEach(g=>g.classList.toggle('dim',!all&&!s.focus.includes(k)));
  for(const id in flowEls){ const f=flowEls[id], on=s.flows.includes(f.key); f.ov.classList.toggle('on',on); f.base.classList.toggle('dimh',!all&&!on); f.shine.classList.toggle('dimh',!all&&!on); }
  $('chip').classList.toggle('on',s.flows.includes('airchip'));
  $('spray').classList.toggle('on',!!s.wash);
  $('bubbles').classList.toggle('on',s.flows.includes('co2'));
  $('mneedle').classList.toggle('on',s.flows.includes('discharge'));
  $('skid').classList.toggle('on',!!s.scoop);
  $('excl').setAttribute('opacity',s.excl?1:0);
  ['t1','t2','t3'].forEach(id=>$(id).style.opacity=s.tanks?'':'0');
  if(s.cut==='run'){cutP=0;hold=0;}

  $('s-kicker').textContent=stepIdx?`Step ${stepIdx} of ${STEPS.length-1}`:'Overview';
  $('s-title').textContent=s.title;
  $('s-text').textContent=s.text;
  $('s-safety').hidden=!s.safety; $('s-safety').textContent=s.safety||'';
  $('prev').disabled=stepIdx===0;
  $('next').textContent=stepIdx===STEPS.length-1?'Back to overview':'Next →';
  const bar=$('steps');
  bar.querySelectorAll('button').forEach((b,j)=>{
    if(j!==stepIdx){b.removeAttribute('aria-current'); return;}
    b.setAttribute('aria-current','step');
    // centre the active chip in the bar without scrolling the page
    const br=b.getBoundingClientRect(), r=bar.getBoundingClientRect();
    bar.scrollLeft+=(br.left+br.width/2)-(r.left+r.width/2);
  });
  panTo(s.x,instant);
  // deep link (#step=5) so a trainer can send someone straight to a step
  try{ history.replaceState(null,'',stepIdx?'#step='+stepIdx:location.pathname+location.search); }catch(e){}
}
function panTo(x,instant){
  const st=$('stage'), sv=$('scene');
  if(st.scrollWidth<=st.clientWidth+2) return;
  const left=x==null?0:x*sv.clientWidth/1300-st.clientWidth/2;
  st.scrollTo({left:Math.max(0,left),behavior:REDUCE||instant?'auto':'smooth'});
}
$('prev').addEventListener('click',()=>setStep(stepIdx-1));
$('next').addEventListener('click',()=>setStep(stepIdx===STEPS.length-1?0:stepIdx+1));
document.addEventListener('keydown',e=>{
  if(dlg.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight') setStep(stepIdx+1);
  if(e.key==='ArrowLeft') setStep(stepIdx-1);
});

// ---- animation loop ----
// The robot starts with its lance over the far edge of the demo area and backs left as it cuts:
// fx is the cut front (concrete is gone from fx to the far edge), nx is where the lance is.
let lastHose='';
function tick(ts){
  const dt=last===null?0:Math.min(.05,(ts-last)/1000); last=ts; clock+=dt;
  const s=S(), W=DEMO[1]-DEMO[0];
  let cutting=false, fx=DEMO[1], nx=DEMO[1];
  if(s.cut==='done'){ fx=DEMO[0]; nx=530; }
  else if(s.cut==='sweep'){ fx=DEMO[1]-.45*W; nx=fx; cutting=true; }
  else if(s.cut==='run'){
    if(REDUCE){ fx=DEMO[1]-.5*W; cutting=true; }
    else if(cutP<1){ cutP=Math.min(1,cutP+dt/9); fx=DEMO[1]-W*cutP; cutting=true; }
    else { fx=DEMO[0]; hold+=dt; if(hold>2.5){cutP=0;hold=0;} }
    nx=fx;
  }
  drawSlab(fx);
  robot.setAttribute('transform',`translate(${(nx+ROX).toFixed(1)},${ROY.toFixed(1)})`);
  // the lance sweeps side to side, which in this view is in and out of the page
  const sw=cutting&&!REDUCE?Math.sin(clock*4)*.28:0;
  lance.setAttribute('transform',`translate(${(DX*sw).toFixed(1)},${(DY*sw).toFixed(1)})`);
  jet.style.display=cutting?'':'none';

  const rear=nx+ROX-128, ly=300+DY*LANE.uhp, hose=path([[232,462],[232,444],[RU,444],[RU,299],at(400,LANE.uhp,300),[rear,ly]]);
  if(hose!==lastHose){ lastHose=hose; const f=flowEls.uhp; f.base.setAttribute('d',hose); f.shine.setAttribute('d',hose); f.ov.setAttribute('d',hose); }

  if(!REDUCE){
    if(cutting&&Math.random()<dt*16) spawn(fx+6+Math.random()*22);
    if(s.wash&&Math.random()<dt*7) spawn(DEMO[0]+10+Math.random()*(W-10));
  }
  for(const p of DEB){
    if(!p.on) continue;
    p.vy+=500*dt; p.y+=p.vy*dt;
    if(p.vy>0&&p.y>=p.floor){p.on=false; p.el.setAttribute('x',-10); continue;}
    p.el.setAttribute('x',p.x.toFixed(1)); p.el.setAttribute('y',p.y.toFixed(1));
  }
  requestAnimationFrame(tick);
}

// ---- print handout: always the full-operation view ----
let beforePrint=null;
$('print').addEventListener('click',()=>window.print());
// paper is white, so print in the light theme even when the screen is in dark mode
let themeWas=null;
window.addEventListener('beforeprint',()=>{beforePrint=stepIdx; setStep(0); themeWas=document.documentElement.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme','light');});
window.addEventListener('afterprint',()=>{if(beforePrint!==null) setStep(beforePrint); beforePrint=null;
  if(themeWas===null) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',themeWas);});

const m=location.hash.match(/step=(\d+)/);
setStep(m?+m[1]:0,true);
requestAnimationFrame(tick);
})();
    </script>
